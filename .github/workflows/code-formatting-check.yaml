name: Code Formatting Check

on:
  push:
  pull_request:
  merge_group:
  schedule: # Trigger a job on default branch at 4AM PST everyday
    - cron: 0 11 * * *

concurrency:
  group: ${{ github.workflow }}-${{ github.event.compare || github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  cargo-fmt:
    name: .rs Formatting Check
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust Toolchain (Nightly)
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          components: rustfmt

      - name: Run Cargo Format
        run: cargo +nightly fmt --all -- --check

  taplo-fmt:
    name: .toml Formatting Check
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust Toolchain (Stable)
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1

      # Using cache-cargo-install-action to cache the compiled binary.
      # Once taplo ships a release with field-level `keys` matching, this can
      # be simplified back to install-action with a normal version pin.
      - name: Install taplo-cli from pinned revision b673b44d
        uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389 # v3.0.8
        with:
          tool: taplo-cli
          git: https://github.com/tamasfe/taplo
          rev: b673b44d
          locked: true
        env:
          RUSTFLAGS: ""

      - run: taplo fmt --check --diff
        name: Check TOML files formatting
